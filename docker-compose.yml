version: '3.8'

services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot    
    depends_on:
      - frontend

  mongodb:
    image: mongo:latest
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=Gik8Z1GrTX74
    command: ["--auth", "--bind_ip", "127.0.0.1,mongodb"]
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
  backend:
    build: 
      context: ./webshop-server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=mongodb://admin:Gik8Z1GrTX74@mongodb:27017/webshop?authSource=admin
      - PORT=3001
      - CORS_ORIGIN=https://giannigiovanni.hu
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./gianni-app
      dockerfile: Dockerfile
    expose:
      - "80"
    environment:
      - VITE_API_URL=https://giannigiovanni.hu/api
    depends_on:
      - backend

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge